{% extends 'base.html' %}
{% block title %}Report{% endblock %}
{% block content %}
        <form>
            <input type="month" value="{{ period }}" name="period">
            <button type="submit">Submit</button>
        </form>
    <div>
        <table class="table-wrapper">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Count</th>
                    <th>Operation</th>
                </tr>
            </thead>
            <tbody>
                {% for record in records %}
                    <tr>
                        <td>{{record['date']}}</td>
                        <td>{{record['count']}}</td>
                        {% if record['count'] > 0 %}
                            <td>
                                <a href="{{record['date']}}"><button class="btn-success">&ShortDownArrow; Download</button></a>
                            </td>
                        {% else %}
                            <td>
                                <button disabled="disabled" class="btn-error">&ShortDownArrow; Download</button>
                            </td>
                        {% endif %}
                    </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>
{% endblock %}
